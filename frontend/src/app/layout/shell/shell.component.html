<div class="shell">
  <aside class="sidebar">
    <div class="brand">StockSmart</div>
    <nav>
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          {{ item.label }}
        </a>
      }
    </nav>
    <p class="sidebar-note">Business modules will be added in later phases.</p>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="title">Retail Inventory Management</span>
      <span class="badge">B.Tech project</span>
    </header>
    <section class="content">
      <router-outlet />
    </section>
  </div>
</div>
