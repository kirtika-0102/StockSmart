<div class="shell">
  <aside class="sidebar">
    <div class="brand">StockSmart</div>
    <nav>
      @for (item of navItems; track item.path) {
        @if (canSee(item.roles)) {
          <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            {{ item.label }}
          </a>
        }
      }
    </nav>
    <p class="sidebar-note">Products, locations, and inventory come next.</p>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="title">Retail Inventory Management</span>
      <div class="session">
        @if (currentUser$ | async; as user) {
          <span class="user">{{ user.fullName }} ({{ user.roles.join(', ') }})</span>
        }
        <button type="button" class="logout" (click)="logout()">Log out</button>
      </div>
    </header>
    <section class="content">
      <router-outlet />
    </section>
  </div>
</div>
