spring:
  application:
    name: stocksmart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:StockSmartCollegeJwtSecretKeyMustBeAtLeast32Bytes!}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
