spring:
  datasource:
    url: jdbc:h2:mem:stocksmart;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

jwt:
  secret: StockSmartTestJwtSecretKeyMustBeAtLeast32BytesLong
  expiration-ms: 3600000
